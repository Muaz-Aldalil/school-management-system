<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مدرسه العامريه — بدون اتصال</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: #FFFDF8; color: #1F2937; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { text-align: center; max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 800; color: #F97316; margin-bottom: 0.5rem; }
    p { color: #6B7280; line-height: 1.6; margin-bottom: 1.5rem; }
    .btn { display: inline-block; padding: 0.75rem 2rem; background: #F97316; color: #fff; border: none; border-radius: 0.75rem; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn:hover { background: #EA580C; }
    .school { font-size: 0.875rem; color: #94A3B8; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>مدرسه العامريه</h1>
    <p>لا يوجد اتصال بالإنترنت. تحقق من اتصالك بالشبكة وحاول مرة أخرى.</p>
    <button class="btn" onclick="location.reload()">إعادة المحاولة</button>
    <div class="school">مدرسه العامريه — نظام إدارة المدرسة</div>
  </div>
</body>
</html>
